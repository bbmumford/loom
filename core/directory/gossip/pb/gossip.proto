syntax = "proto3";

package loom.mesh.gossip.v1;

option go_package = "github.com/bbmumford/loom/core/directory/gossip/pb";

// GossipEnvelope is the wire format for gossip exchanges.
// The records field carries opaque serialised payloads — the gossip engine
// does not know or care about record structure. Each consumer defines its
// own record proto; LADRecord below is the directory's, and the envelope
// does not depend on it.
//
// codecVersion and schemaVersion name the encoding of the envelope and of
// its records. The sender writes the pair its session's negotiated
// gossip.codec version maps to, and the receiver reads the two fields before it
// decodes meta or any record, refusing a pair that version does not write
// (loom core/directory/gossip checkEnvelopeVersions).
message GossipEnvelope {
    ExchangeMeta meta = 1;
    repeated bytes records = 2;  // opaque serialised records
    uint32 codecVersion = 3;
    uint32 schemaVersion = 4;
}

// ExchangeMeta carries per-exchange metadata piggybacked on gossip frames.
message ExchangeMeta {
    uint64 cacheFingerprint = 1;
    string region = 2;
    bool backpressureSignal = 3;

    // PEX entries piggybacked on gossip
    repeated PEXEntry pexEntries = 4;

    // Connection counts for load balancing
    map<string, int32> connectionCounts = 5;

    // Connection offer for NAT traversal signaling
    ConnectionOffer offer = 6;
}

// PEXEntry is a signed peer exchange advertisement.
//
// Receivers prefer same-region peers when picking probe targets;
// without `region` on the wire, every received PEXEntry looks like
// it could be cross-region and the same-region preference cannot
// take effect. Mirrors the lad.Record.Region carried in the body
// for direct LADRecord messages.
message PEXEntry {
    string nodeId = 1;
    repeated string addresses = 2;
    int64 timestampUnix = 3;
    bytes signature = 4;
    string region = 5;
}

// ConnectionOffer signals desire for a direct connection.
message ConnectionOffer {
    string fromNodeId = 1;
    string toNodeId = 2;
    repeated string addresses = 3;
    string transport = 4;
    int64 timestampUnix = 5;
    bytes signature = 6;
}

// LADRecord is the wire format for loom directory records. It is NOT part
// of the gossip engine's generic envelope.
//
// Fields 12-15 let receiving peers reconstruct the full lad.Record state
// from a gossip exchange:
//   - hlcTimestamp: HLC tie-breaker for IBLT reconcile and snapshot
//     manifest HLC; without it, every peer interprets the record at
//     HLC=0 and stale records win on equal lamport clocks.
//   - expiresAtUnix: TTL for tombstone pruning; without it the
//     receiver treats every record as never-expires.
//   - authorPubkey: signed-topic enforcement — verifiers need the
//     pubkey alongside the signature.
//   - blobCid: content-addressed reference for off-record blobs
//     (snapshot manifest payloads).
//
// All four use the zero-check pattern from `deletedAtUnix`
// so unset fields round-trip cleanly without surprise default-zero
// effects.
message LADRecord {
    string topic = 1;
    string nodeId = 2;
    string partitionId = 3;
    bytes body = 4;             // opaque sub-document (roles, reach, member JSON)
    int64 timestampUnix = 5;
    uint64 lamportClock = 6;
    uint64 seq = 7;
    bool tombstone = 8;
    int64 deletedAtUnix = 9;
    string tombstoneReason = 10;
    bytes signature = 11;
    uint64 hlcTimestamp = 12;
    int64 expiresAtUnix = 13;
    bytes authorPubkey = 14;
    string blobCid = 15;
}
